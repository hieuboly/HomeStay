<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Đặt phòng - StayNest</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="container page-shell booking-shell">
    <div class="booking-layout">
        <div class="booking-summary card-panel">
            <img th:src="${room.imageUrl}" th:alt="${room.title}">
            <div class="card-body">
                <span class="eyebrow" th:text="${room.city}">Đà Lạt</span>
                <h2 th:text="${room.title}">Villa Sunset View</h2>
                <p th:text="${room.description}">Mô tả</p>
                <div class="detail-price">
                    <strong th:text="${#numbers.formatDecimal(room.pricePerNight, 0, 'COMMA', 0, 'POINT') + 'đ'}">1.200.000đ</strong>
                    <span>/đêm</span>
                </div>
            </div>
        </div>

        <div class="booking-form-panel card-panel">
            <h2>Thông tin đặt phòng</h2>
            <div th:if="${errorMessage}" class="message error-message" th:text="${errorMessage}">Lỗi</div>
            <form th:action="@{/booking/{roomId}(roomId=${room.id})}" method="post">
                <div class="field-group">
                    <label for="checkInDate">Ngày nhận phòng</label>
                    <input id="checkInDate" type="date" name="checkInDate" required>
                </div>
                <div class="field-group">
                    <label for="checkOutDate">Ngày trả phòng</label>
                    <input id="checkOutDate" type="date" name="checkOutDate" required>
                </div>
                <div class="field-group">
                    <label for="guestCount">Số khách</label>
                    <input id="guestCount" type="number" name="guestCount" min="1" max="10" required value="2">
                </div>
                <div class="field-group">
                    <label for="customerName">Họ tên</label>
                    <input id="customerName" type="text" name="customerName" required>
                </div>
                <div class="field-group">
                    <label for="customerPhone">Số điện thoại</label>
                    <input id="customerPhone" type="text" name="customerPhone" required>
                </div>
                <div class="field-group">
                    <label for="notes">Ghi chú</label>
                    <textarea id="notes" name="notes" rows="3"></textarea>
                </div>
                <button type="submit" class="primary-btn auth-btn">Xác nhận đặt phòng</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>

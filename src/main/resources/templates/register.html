<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - StayNest</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="auth-shell">
    <div class="auth-card">
        <h2>Đăng ký tài khoản</h2>
        <p class="auth-subtitle">Tạo tài khoản để đặt phòng nhanh hơn</p>

        <div th:if="${errorMessage}" class="message error-message" th:text="${errorMessage}">Lỗi</div>

        <form th:action="@{/register}" method="post">
            <div class="field-group">
                <label for="username">Tên đăng nhập</label>
                <input id="username" name="username" type="text" required>
            </div>
            <div class="field-group">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>
            </div>
            <div class="field-group">
                <label for="password">Mật khẩu</label>
                <input id="password" name="password" type="password" required>
            </div>
            <button type="submit" class="primary-btn auth-btn">Đăng ký</button>
        </form>

        <p class="auth-footer">Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
    </div>
</div>
</body>
</html>

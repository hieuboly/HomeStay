<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ của tôi - StayNest</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="container page-shell profile-shell">
    <section class="profile-card card-panel">
        <span class="eyebrow">Tài khoản</span>
        <h1>Hồ sơ của tôi</h1>
        <dl class="profile-details">
            <div><dt>Tên đăng nhập</dt><dd th:text="${user.username}">username</dd></div>
            <div><dt>Email</dt><dd th:text="${user.email}">email@example.com</dd></div>
        </dl>
    </section>

    <section class="profile-bookings">
        <div class="section-heading">
            <span class="eyebrow">Lịch sử</span>
            <h2>Đặt phòng của tôi</h2>
        </div>
        <div class="table-wrap card-panel" th:if="${!bookings.isEmpty()}">
            <table>
                <thead>
                <tr>
                    <th>Mã đặt</th>
                    <th>Homestay</th>
                    <th>Nhận phòng</th>
                    <th>Trả phòng</th>
                    <th>Tổng tiền</th>
                    <th>Trạng thái</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="booking : ${bookings}">
                    <td th:text="${booking.id}">1</td>
                    <td th:text="${booking.room.title}">Homestay</td>
                    <td th:text="${booking.checkInDate}">2026-10-10</td>
                    <td th:text="${booking.checkOutDate}">2026-10-12</td>
                    <td th:text="${#numbers.formatDecimal(booking.totalPrice, 0, 'COMMA', 0, 'POINT') + 'đ'}">0đ</td>
                    <td th:text="${booking.status}">PENDING</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="empty-state card-panel" th:if="${bookings.isEmpty()}">
            <p>Bạn chưa có lượt đặt phòng nào.</p>
            <a class="primary-btn" th:href="@{/rooms}">Khám phá homestay</a>
        </div>
    </section>
</main>
</body>
</html>
